[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bashllm"
version = "0.1.0"
description = "Bounded Bash operations and repository context for coding agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bashllm = "bashllm.cli:main"
bashllm-mcp = "bashllm.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
