name: macOS containment

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-15
    env:
      BASHLLM_REQUIRE_MACOS_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run installed-CLI suite
        run: python3 -m unittest discover -s tests -v
